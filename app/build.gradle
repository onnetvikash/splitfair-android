plugins {
    id 'com.android.application'
}

android {
    namespace 'in.devexis.splitfair'
    compileSdk 34

    defaultConfig {
        applicationId "in.devexis.splitfair"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Release signing is optional: set these environment variables (see README)
    // to produce a signed release APK/AAB. Without them the release build is unsigned.
    def keystorePath = System.getenv('KEYSTORE_PATH')
    if (keystorePath) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
